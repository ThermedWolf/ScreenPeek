plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'screenpeek'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"screenpeek" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Second offline client for two-player verification (see README "Verify").
	runs {
		client2 {
			client()
			name = "Client 2"
			runDir = "run2"
			programArgs("--username", "Player2")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':protocol')
	include project(':protocol')

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Pure-logic client classes are unit-tested without launching Minecraft; the
// test source set therefore also sees the client source set's output.
sourceSets.test {
	compileClasspath += sourceSets.client.output
	runtimeClasspath += sourceSets.client.output
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

processResources {
	def modVersion = project.mod_version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

// Dev clients use offline sessions, so the dev server must run in offline
// mode or they cannot join. Loom has no knob for this, so seed the property
// before first server boot; an existing server.properties is never touched.
tasks.matching { it.name == 'runServer' }.configureEach {
	doFirst {
		def serverProperties = file('run/server.properties')
		if (!serverProperties.exists()) {
			serverProperties.parentFile.mkdirs()
			serverProperties.text = 'online-mode=false\n'
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
